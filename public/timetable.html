<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時刻表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=M+PLUS+1p&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
    font-family: "Noto Sans JP", sans-serif;
    box-sizing: border-box;
}
    #timetable {
        display: flex;
        align-items: center;
        list-style: none;
        padding: 0;
        margin: 0;
        font-weight: 1000;
        justify-content:center;
    }
    #timetable > li {
    height: 30px;
    box-sizing: border-box;
    
    }
    .標準時分 {
        width: 30px;
        border: 2px solid #ccc;
        text-align: center;
    }
    .標準時分 .分 {
        font-size: 0.6em;
    }
    .駅名 {
    height: 30px;
    width: 70px;
    border: 2px solid #ccc;
    display: flex;
    justify-content: center;
    align-items: center;
    padding:0;
    }
    .発時刻 {
        width: 80px;
        display: flex;
        border: 2px solid #ccc;
        justify-content: left;
        align-items: baseline;
    }
    .発時分 {
        font-size: 1.2em;
    }
    .発秒 {
        margin-left: 5px;
    }
    .着時刻 {
        width: 80px;
        display: flex;
        border: 2px solid #ccc;
        justify-content: left;
        align-items: baseline;
    }
    .着時分 {
        font-size: 1.2em;
    }
    .着秒 {
        margin-left: 5px;
    }
    .番線 {
        width: 30px;
        border: 2px solid #ccc;
        text-align: center;
    }
    .進制限 {
        width: 15px;
        font-size: 0.6em;
        display: flex;
        flex-direction: column;
        border: 2px solid #ccc;
    }
    #info{
        display:flex;
        width:100%;
        justify-content:center;
        padding: 0;
        margin: 0;
    }
    #info .行先{
        text-align: center;
        width: 100%;
        border-bottom:1px solid #ccc;
    }
    #info li{
        list-style: none;
        border:2px solid beige;
        width:40px;
        height:50px;
        justify-content: center;
        align-items: center;
        display: flex;
    }
    #info 
    .lInfo{
        display: flex;
        flex-direction: column;
        width:105px;
    }
    .両数{
        font-size:50px;
        color:red;
    }
    #info .制限{
        width: 105px;
        font-size:45px;
    }
</style>
</head>
<body>
    <ul id="info">
        <li class="lInfo">
            <span class="行先">稲沢</span>
            <span class="運番">01S</span>
        </li>
        <li class="両数">2</li>
        <li class="編成">1000</li>
        <li class="制限">130</li>
    </ul>
    <ul id="timetable">
        <li class="標準時分">
            <span class="時">1</span>
            <span class="分">30</span>
        </li>
        <li class="駅名">木曽川</li>
        <li class="発時刻">
            <span class="発時分">08:00</span>
            <span class="発秒">00</span>
        </li>
        <li class="着時刻">
            <span class="着時分">08:00</span>
            <span class="着秒">00</span>
        </li>
        <li class="番線">上1</li>
        <li class="進制限">
        <span class="進出制限">45</span>
        <span class="進入制限">30</span>
        </li>
    </ul>
<script>
    
</script>
</body>
</html>
